apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  instanceProfile: {{ required "instanceProfile is required" .Values.instanceProfile | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "clusterName is required" .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - id: {{ required "securityGroupId is required" .Values.securityGroupId | quote }}
  metadataOptions:
    httpTokens: required # IMDSv2 only
    httpPutResponseHopLimit: 1 # pods can't reach the node's IMDS credentials
  {{- with .Values.tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
