# Repo-wide Checkov config.
#
# Inline `# checkov:skip=` comments work for simple resource checks (see the
# CKV_AWS_355 and CKV_AWS_23 skips throughout the codebase), but Checkov's
# graph-based checks don't reliably resolve inline skip comments through a
# Terraform module boundary - a skip on a data.aws_iam_policy_document
# inside terraform/modules/eks-platform/karpenter.tf isn't honored once
# that module is instantiated from terraform/environments/*/main.tf. These
# three checks are skipped here, repo-wide, instead - each has been
# reviewed against every current occurrence in this codebase:
#
#   CKV_AWS_356 / CKV_AWS_108 / CKV_AWS_111
#     - bootstrap/iam.tf: apply_permissions (resource-creation actions -
#       ec2:CreateVpc, eks:CreateCluster, etc. - take no resource ARN
#       because the resource doesn't exist yet; scoped instead by region,
#       and separately by IAM role name prefix / KMS / S3 bucket ARN in
#       the statements below it)
#     - terraform/modules/eks-platform/karpenter.tf: karpenter_controller_permissions
#       (same shape as AWS's own published Karpenter getting-started policy)
#     - terraform/modules/observability/main.tf: grafana_data_sources
#       (AMP/CloudWatch query APIs have no resource-level ARN scoping at all)
#
# New findings for these checks on a *new* resource should still be reviewed
# on their own merits, not assumed to fall into the same bucket - see each
# resource's own comment for the specific reasoning.
skip-check:
  - CKV_AWS_356
  - CKV_AWS_111
  - CKV_AWS_108
