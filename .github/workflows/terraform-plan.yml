name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths: &plan_paths
      - "terraform/**"
      - "bootstrap/**"
      - "policy/**"
      - "scripts/**"
      - "examples/hybrid-network/**"
      - ".github/workflows/terraform-*.yml"
  # Re-runs the same gate against main post-merge. Not just a badge nicety:
  # a merge commit combining two clean PRs isn't guaranteed clean itself.
  push:
    branches: [main]
    paths: *plan_paths
  workflow_dispatch: {} # lets security-scan (no AWS creds needed) run standalone

permissions:
  id-token: write # OIDC -> AWS, no static access keys anywhere in this repo
  contents: read
  pull-requests: write # to post the plan as a PR comment

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"

jobs:
  detect-changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.filter.outputs.dev }}
      prod: ${{ steps.filter.outputs.prod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            dev:
              - 'terraform/environments/dev/**'
              - 'terraform/modules/**'
            prod:
              - 'terraform/environments/prod/**'
              - 'terraform/modules/**'

  # Module unit tests use mocked providers: no AWS account, no credentials, no
  # cost. They pin the behavior that matters (segmentation defaults, pinned TLS
  # suites, input validation) so a refactor can't quietly loosen it.
  module-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform test (every module and example that has tests)
        run: |
          set -euo pipefail
          for dir in $(find terraform/modules bootstrap examples -type d -name tests -exec dirname {} \; | sort); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done
      - name: Validate reference compositions
        run: |
          set -euo pipefail
          for dir in examples/hybrid-network; do
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done
      - name: Change gate unit tests
        run: python3 -m unittest scripts/test_change_gate.py -v
      - name: Policy unit tests (conftest verify)
        run: |
          docker run --rm -v "$PWD/policy/conftest":/policy             openpolicyagent/conftest verify -p /policy

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        # No soft_fail input at all: the action passes --soft-fail whenever the
        # input is non-empty, so even `soft_fail: false` silently disabled the
        # gate. Omitted, a real finding fails the job and blocks the PR.
        with:
          working_directory: terraform

      - name: Checkov
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12
        with:
          directory: terraform
          framework: terraform
          config_file: .checkov.yaml
          soft_fail: false
          quiet: true

      - name: tflint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: latest
      - run: tflint --init && tflint --recursive --format compact
        working-directory: terraform

  plan:
    needs: [detect-changes, security-scan]
    # Requires both a PR (detect-changes only runs then) and a bootstrapped
    # PLAN_ROLE_ARN - see bootstrap/README.md. Skips cleanly otherwise.
    if: |
      vars.PLAN_ROLE_ARN != '' &&
      (needs.detect-changes.outputs.dev == 'true' || needs.detect-changes.outputs.prod == 'true')
    runs-on: ubuntu-latest
    strategy:
      # One environment's failure shouldn't cancel the other's plan - a
      # reviewer needs both results.
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    env:
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_platform_admin_principal_arns: ${{ vars.PLATFORM_ADMIN_ARNS || '[]' }}
      TF_VAR_cluster_viewer_principal_arns: ${{ format('["{0}"]', vars.PLAN_ROLE_ARN) }}
      TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-tf-plan-${{ matrix.environment }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Line endings are normalized to LF by .gitattributes on checkout, so
      # this only ever fails on real formatting drift, not CRLF noise from a
      # contributor's local git config.
      - name: Terraform fmt check
        run: terraform fmt -check -recursive ../../

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        # Wait out an in-progress apply's state lock instead of failing on it
        # (a first apply that creates the EKS cluster runs ~20-25 minutes).
        run: terraform plan -input=false -no-color -lock-timeout=30m -out=tfplan.binary
        continue-on-error: true

      # Skipped when plan failed: there's no plan file, and the plan step's own
      # error (surfaced by "Fail if plan errored") is the one that matters.
      - name: Save plan text for PR comment
        if: steps.plan.outcome == 'success'
        run: terraform show -no-color tfplan.binary > tfplan.txt

      - name: Policy gate (conftest)
        if: steps.plan.outcome == 'success'
        run: |
          terraform show -json tfplan.binary > plan.json
          docker run --rm -v "$PWD":/project -v "$PWD/../../../policy/conftest":/policy \
            openpolicyagent/conftest test /project/plan.json -p /policy

      - name: Comment plan on PR
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/${{ matrix.environment }}/tfplan.txt', 'utf8').slice(0, 60000);
            const body = `#### Terraform Plan — \`${{ matrix.environment }}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
