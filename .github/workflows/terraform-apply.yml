name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "bootstrap/**"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        type: choice
        options: [dev, prod]
      change_request:
        description: "prod only: ServiceNow change record (CHG0000000) authorizing this apply"
        required: false
        type: string
      emergency_incident:
        description: "prod only: ServiceNow P1/P2 incident (INC0000000) - use INSTEAD of a change record for an emergency change"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"

jobs:
  # Always runs, regardless of whether AWS is bootstrapped. Without this, a
  # run where both apply-dev and apply-prod skip has *no* non-skipped job at
  # all, and GitHub reports the whole run's conclusion as "skipped" - which
  # the status badge renders as failing, not passing. This job's job is
  # purely to guarantee the run always has one real success in it.
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Report bootstrap status
        run: |
          if [ -n "${{ vars.APPLY_ROLE_ARN }}" ]; then
            echo "AWS is bootstrapped for this repo - apply-dev/apply-prod run for real."
          else
            echo "::notice::AWS isn't bootstrapped for this repo yet (see bootstrap/README.md)." \
                 "This is a template repo, not wired to a real AWS account, so apply-dev/apply-prod" \
                 "have nothing to do until APPLY_ROLE_ARN is set as a repo variable."
          fi

  apply-dev:
    # Skips cleanly (not a failure) until bootstrap/ has been applied and
    # APPLY_ROLE_ARN is set as a repo variable - see bootstrap/README.md.
    # This repo ships with no AWS account wired up, so this guard is what
    # keeps a fresh clone's Actions tab green instead of red.
    if: vars.APPLY_ROLE_ARN != '' && (github.event_name == 'push' || github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev # no required reviewers - dev auto-applies on merge
    defaults:
      run:
        working-directory: terraform/environments/dev
    env:
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_platform_admin_principal_arns: ${{ vars.PLATFORM_ADMIN_ARNS || '[]' }}
      TF_VAR_cluster_viewer_principal_arns: ${{ format('["{0}"]', vars.PLAN_ROLE_ARN) }}
      TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-tf-apply-dev

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -input=false
      - run: terraform apply -input=false -lock-timeout=30m -auto-approve

  apply-prod:
    if: vars.APPLY_ROLE_ARN != '' && github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    # `environment: prod` is a GitHub Environment with required reviewers
    # configured in repo settings - the review gate lives there, not in an
    # `if:` in this file, so it can't be bypassed by editing the workflow in
    # the same PR that triggers it.
    environment: prod
    defaults:
      run:
        working-directory: terraform/environments/prod
    env:
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_platform_admin_principal_arns: ${{ vars.PLATFORM_ADMIN_ARNS || '[]' }}
      TF_VAR_cluster_viewer_principal_arns: ${{ format('["{0}"]', vars.PLAN_ROLE_ARN) }}
      TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS || '[]' }}
      # ITSM change gate - enforced whenever SERVICENOW_INSTANCE is set.
      # See docs/CHANGE-MANAGEMENT.md.
      SN_INSTANCE: ${{ vars.SERVICENOW_INSTANCE }}
      SN_USER: ${{ secrets.SERVICENOW_USER }}
      SN_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}
      CHANGE_REQUEST: ${{ github.event.inputs.change_request }}
      EMERGENCY_INCIDENT: ${{ github.event.inputs.emergency_incident }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs AFTER the environment's reviewer approval (the job only starts once
      # that's granted), so the change window is checked at the moment of apply
      # - not when someone queued the run hours earlier. Inputs go through env
      # vars, never interpolated into the script, so a crafted input can't inject
      # shell.
      - name: Change gate (ServiceNow)
        if: env.SN_INSTANCE != ''
        run: |
          args=()
          [ -n "$CHANGE_REQUEST" ] && args+=(--change "$CHANGE_REQUEST")
          [ -n "$EMERGENCY_INCIDENT" ] && args+=(--emergency-incident "$EMERGENCY_INCIDENT")
          python3 "$GITHUB_WORKSPACE/scripts/change_gate.py" check "${args[@]}"

      - name: Change gate not configured
        if: env.SN_INSTANCE == ''
        run: echo "::notice::SERVICENOW_INSTANCE is not set - no change-record gate on this prod apply. Only the 'prod' environment reviewers stand between merge and apply. See docs/CHANGE-MANAGEMENT.md."

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-tf-apply-prod

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -input=false
      - run: terraform apply -input=false -lock-timeout=30m -auto-approve

      # Close the loop: the change record shows what actually happened, without
      # anyone copy-pasting. Best-effort - a note failing must not fail a
      # successful apply.
      - name: Record outcome on change record
        if: always() && env.SN_INSTANCE != '' && env.CHANGE_REQUEST != ''
        continue-on-error: true
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/change_gate.py" note \
            --change "$CHANGE_REQUEST" \
            --message "terraform apply (prod) ${{ job.status }} - commit ${{ github.sha }} - run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # An emergency change bypasses the pre-approval, so it gets a mandatory
  # after-the-fact review: an issue that must be closed by a human.
  emergency-review:
    needs: apply-prod
    if: always() && needs.apply-prod.result != 'skipped' && github.event.inputs.emergency_incident != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open post-implementation review issue
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT: ${{ github.event.inputs.emergency_incident }}
          RESULT: ${{ needs.apply-prod.result }}
        run: |
          gh label create emergency-change --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Prod change applied under the emergency path; needs post-implementation review" 2>/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Post-implementation review: emergency change for $INCIDENT" \
            --label "emergency-change" \
            --body "Emergency prod apply for **$INCIDENT** finished with result **$RESULT** (commit \`$GITHUB_SHA\`, run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          Required within 5 business days:
          - [ ] Retroactive change record linked and approved
          - [ ] Change reviewed: was it the right mitigation, was there a safer one?
          - [ ] Follow-up fixed via the normal change process (this apply skipped the pre-approval)
          - [ ] Referenced in the incident postmortem"
