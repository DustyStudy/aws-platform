name: Drift Detection

on:
  schedule:
    - cron: "0 13 * * *" # daily, 13:00 UTC
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"

jobs:
  # Always runs. Without it, a run where every detect-drift matrix leg skips
  # has no non-skipped job at all, so GitHub reports the run's own
  # conclusion as "skipped" - which the status badge renders as failing.
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Report bootstrap status
        run: |
          if [ -z "${{ vars.PLAN_ROLE_ARN }}" ]; then
            echo "::notice::AWS isn't bootstrapped for this repo yet (see bootstrap/README.md)." \
                 "This is a template repo, not wired to a real AWS account, so there's no state to check for drift yet."
          fi

  detect-drift:
    # Skips cleanly until bootstrap/ has been applied and PLAN_ROLE_ARN is
    # set as a repo variable - see bootstrap/README.md.
    if: vars.PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
      fail-fast: false
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    env:
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_platform_admin_principal_arns: ${{ vars.PLATFORM_ADMIN_ARNS || '[]' }}
      TF_VAR_cluster_viewer_principal_arns: ${{ format('["{0}"]', vars.PLAN_ROLE_ARN) }}
      TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS || '[]' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-drift-${{ matrix.environment }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -input=false

      # An environment that has never been applied has no state to drift from;
      # its "plan" is every resource as new. Report that instead of opening a
      # drift issue for it.
      - name: Check the environment is deployed
        id: deployed
        run: |
          # terraform-bin: setup-terraform's wrapper adds its own lines to
          # stdout, so the wrapped `terraform state list` is never empty.
          if [ -z "$(terraform-bin state list)" ]; then
            echo "::notice::${{ matrix.environment }} has no Terraform state (never applied) - nothing to check for drift."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan (detect drift)
        id: plan
        if: steps.deployed.outputs.deployed == 'true'
        run: terraform plan -input=false -no-color -lock-timeout=30m -detailed-exitcode -out=tfplan.binary
        continue-on-error: true

      - name: Save plan text
        if: steps.plan.outputs.exitcode == '2'
        run: terraform show -no-color tfplan.binary > tfplan.txt

      - name: Open or update a drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/${{ matrix.environment }}/tfplan.txt', 'utf8').slice(0, 60000);
            const title = `Drift detected: ${{ matrix.environment }}`;
            const label = 'drift';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const match = existing.data.find(i => i.title === title);

            const body = `Scheduled drift check found a difference between state and reality in \`${{ matrix.environment }}\`.\n\n<details><summary>Plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;

            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: [label] });
            }

      - name: Fail the job if drift was found
        if: steps.plan.outputs.exitcode == '2'
        run: exit 1

      - name: Fail the job if the plan itself errored
        if: steps.plan.outcome == 'failure' && steps.plan.outputs.exitcode != '2'
        run: exit 1
